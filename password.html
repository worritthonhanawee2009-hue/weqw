<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ใส่รหัสวันเกิด</title>
    <style>
        :root {
            --bg: #2a0018;
            --matrix-dim: rgba(161, 19, 156, 0.18);
            --matrix-bright: rgba(255, 120, 201, 0.95);
            --text: #ffe6f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "JetBrains Mono", "Fira Mono", "Consolas", "Courier New", monospace;
            background: radial-gradient(circle at 20% 20%, #521135, var(--bg));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #matrix,
        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .card {
            width: min(92vw, 420px);
            background: rgba(50, 9, 38, 0.88);
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 28px rgba(255, 120, 201, 0.16);
            padding: 28px 24px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 120, 201, 0.55);
            transition: opacity 0.35s ease, transform 0.5s ease;
        }

        .card.exit {
            opacity: 0;
            transform: scale(0.82) translateY(18px);
            pointer-events: none;
        }

        .title {
            color: #ff9bd8;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #f6c2e2;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .input-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .code-input {
            width: 140px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 120, 201, 0.65);
            border-radius: 10px;
            background: rgba(31, 4, 25, 0.8);
            color: var(--text);
            font-size: 20px;
            text-align: center;
            letter-spacing: 0.25em;
            outline: none;
        }

        .code-input:focus {
            border-color: #ff78c9;
            box-shadow: 0 0 0 3px rgba(255, 120, 201, 0.2);
        }

        .code-input::placeholder {
            color: rgba(255, 230, 246, 0.45);
        }

        .button {
            background: linear-gradient(to right, #e83c9b, #a1139c);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .button:hover {
            transform: scale(1.03);
        }

        .message {
            min-height: 24px;
            margin-top: 10px;
            color: #ff9bd8;
            font-weight: 600;
        }

        .message.error {
            color: #dc2626;
        }

        .burst-scene {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: grid;
            place-items: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .burst-scene.show {
            opacity: 1;
            visibility: visible;
        }

        .envelope {
            position: relative;
            width: min(68vw, 300px);
            aspect-ratio: 1.42;
            border: 2px solid rgba(255, 230, 246, 0.9);
            border-radius: 8px;
            background: linear-gradient(145deg, #ffd8ec, #e879b7);
            box-shadow: 0 0 35px rgba(255, 120, 201, 0.55);
            transform-origin: center;
        }

        .envelope::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #ffb9dc, #ed75b5);
            clip-path: polygon(0 0, 50% 58%, 100% 0);
            z-index: 2;
        }

        .envelope::after {
            content: "♥";
            position: absolute;
            left: 50%;
            top: 54%;
            color: #b20b75;
            font: 42px/1 "Segoe UI", sans-serif;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
        }

        .envelope-flap {
            position: absolute;
            inset: 0 0 auto;
            height: 58%;
            background: #ffe1f0;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: 50% 0;
            transition: transform 0.38s ease;
            z-index: 3;
        }

        .opening .envelope-flap {
            transform: rotateX(180deg);
        }

        .exploded .envelope {
            animation: envelopeBlast 0.72s cubic-bezier(0.2, 0.75, 0.25, 1) forwards;
        }

        .shard {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 38px;
            height: 46px;
            background: linear-gradient(145deg, #fff0f8, #f05daa);
            opacity: 0;
            clip-path: polygon(50% 0, 100% 72%, 35% 100%, 0 35%);
            filter: drop-shadow(0 0 9px rgba(255, 120, 201, 0.95));
        }

        .exploded .shard {
            animation: shardBlast 0.85s cubic-bezier(0.12, 0.7, 0.25, 1) forwards;
        }

        .shard:nth-child(2) { --x: -190px; --y: -130px; --spin: -220deg; }
        .shard:nth-child(3) { --x: 180px; --y: -150px; --spin: 250deg; }
        .shard:nth-child(4) { --x: -220px; --y: 95px; --spin: 180deg; }
        .shard:nth-child(5) { --x: 210px; --y: 100px; --spin: -280deg; }
        .shard:nth-child(6) { --x: -70px; --y: -220px; --spin: 200deg; }
        .shard:nth-child(7) { --x: 80px; --y: 220px; --spin: -190deg; }

        @keyframes envelopeBlast {
            0% { opacity: 1; transform: scale(1) rotate(0); }
            35% { opacity: 1; transform: scale(1.18) rotate(-5deg); }
            100% { opacity: 0; transform: scale(0.35) rotate(24deg); }
        }

        @keyframes shardBlast {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(0); }
            18% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.15) rotate(var(--spin)); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        .letter {
            display: none;
            margin-top: 20px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            border: 2px solid #fbcfe8;
            animation: fadeIn 0.8s ease-out;
        }

        .letter h2 {
            color: #db2777;
            margin-top: 0;
            text-align: center;
        }

        .letter p {
            color: #374151;
            line-height: 1.6;
        }

        .heart {
            width: 32px;
            height: 32px;
            margin: 0 auto 10px;
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #start-music {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.06em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            backdrop-filter: blur(6px);
            z-index: 3;
        }

        #start-music.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(-4px);
        }
    </style>
</head>
<body>
    <canvas id="matrix" aria-hidden="true"></canvas>
    <canvas id="particles" aria-hidden="true"></canvas>

    <button id="start-music" type="button">Tap to Start Music</button>

    <audio id="bg-music" autoplay loop preload="auto">
        <source src="多喜欢你.mp3" type="audio/mpeg" />
    </audio>

    <div class="card">
        <img class="heart" src="https://cdn-icons-png.flaticon.com/512/833/833472.png" alt="heart" />
        <h1 class="title">ใส่รหัสวันเกิด</h1>
        <p class="subtitle">พิมพ์เลข 8 หลักเพื่อเปิดจดหมายของคุณ</p>

        <div class="input-box">
            <input id="codeInput" class="code-input" type="text" inputmode="numeric" maxlength="8" placeholder="________" />
            <button id="checkBtn" class="button" type="button">เปิดจดหมาย</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <div id="burst-scene" class="burst-scene" aria-hidden="true">
        <div class="envelope">
            <span class="envelope-flap"></span>
            <span class="shard"></span>
            <span class="shard"></span>
            <span class="shard"></span>
            <span class="shard"></span>
            <span class="shard"></span>
            <span class="shard"></span>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById("bg-music");
        const startMusicBtn = document.getElementById("start-music");
        const codeInput = document.getElementById("codeInput");
        const checkBtn = document.getElementById("checkBtn");
        const messageEl = document.getElementById("message");
        const card = document.querySelector(".card");
        const burstScene = document.getElementById("burst-scene");
        const musicKey = "birthday-music-time";

        const matrixCanvas = document.getElementById("matrix");
        const matrixCtx = matrixCanvas.getContext("2d");
        const particleCanvas = document.getElementById("particles");
        const particleCtx = particleCanvas.getContext("2d");
        const matrixChars = "love";
        const glowChars = "miss you";
        const backgroundSpeed = 0.35;
        const particles = [];
        let canvasWidth = 0;
        let canvasHeight = 0;
        let charSize = 18;
        let columns = 0;
        let rows = 0;
        let matrix = [];

        const resizeBackground = () => {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            matrixCanvas.width = particleCanvas.width = canvasWidth;
            matrixCanvas.height = particleCanvas.height = canvasHeight;
            charSize = Math.max(14, Math.min(22, Math.floor(canvasWidth / 60)));
            columns = Math.ceil(canvasWidth / charSize);
            rows = Math.ceil(canvasHeight / charSize);
            matrix = Array.from({ length: columns * rows }, () => matrixChars[Math.floor(Math.random() * matrixChars.length)]);
            particles.length = 0;
            for (let index = 0; index < 110; index += 1) {
                particles.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    radius: 1 + Math.random() * 2.2,
                    speed: 0.5 + Math.random() * 1.5,
                    drift: -0.35 + Math.random() * 0.7,
                    alpha: 0.2 + Math.random() * 0.6,
                });
            }
        };

        const drawBackground = () => {
            matrixCtx.fillStyle = "rgba(5, 7, 11, 0.35)";
            matrixCtx.fillRect(0, 0, canvasWidth, canvasHeight);
            matrixCtx.font = `${charSize}px "JetBrains Mono", "Fira Mono", Consolas, monospace`;
            matrixCtx.textAlign = "center";
            matrixCtx.textBaseline = "middle";

            for (let row = 0; row < rows; row += 1) {
                for (let column = 0; column < columns; column += 1) {
                    const index = row * columns + column;
                    if (Math.random() < 0.06 * backgroundSpeed) {
                        matrix[index] = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                    }
                    matrixCtx.fillStyle = "rgba(161, 19, 156, 0.18)";
                    matrixCtx.fillText(matrix[index], column * charSize + charSize / 2, row * charSize + charSize / 2);
                }
            }

            particleCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            for (const particle of particles) {
                particleCtx.globalAlpha = particle.alpha;
                particleCtx.fillStyle = "rgba(255, 255, 255, 0.85)";
                particleCtx.beginPath();
                particleCtx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                particleCtx.fill();
                particle.y += particle.speed * backgroundSpeed;
                particle.x += particle.drift * backgroundSpeed;
                if (particle.y > canvasHeight + 10) {
                    particle.y = -10;
                    particle.x = Math.random() * canvasWidth;
                }
            }
            particleCtx.globalAlpha = 1;
            requestAnimationFrame(drawBackground);
        };

        resizeBackground();
        window.addEventListener("resize", resizeBackground);
        requestAnimationFrame(drawBackground);

        const playMusic = async () => {
            const savedTime = Number(localStorage.getItem(musicKey));
            if (!Number.isNaN(savedTime) && savedTime > 0) {
                bgMusic.currentTime = savedTime;
            }
            try {
                await bgMusic.play();
                startMusicBtn.classList.remove("show");
            } catch (err) {
                startMusicBtn.classList.add("show");
            }
        };

        playMusic();
        document.addEventListener("click", () => {
            if (bgMusic.paused) {
                playMusic();
            }
        }, { once: true });

        startMusicBtn.addEventListener("click", () => {
            playMusic();
        });

        window.addEventListener("beforeunload", () => {
            localStorage.setItem(musicKey, String(bgMusic.currentTime || 0));
        });

        setInterval(() => {
            localStorage.setItem(musicKey, String(bgMusic.currentTime || 0));
        }, 1000);

        let isUnlocking = false;
        const unlock = () => {
            if (isUnlocking) return;
            const value = codeInput.value.trim();
            if (value === "28092010") {
                isUnlocking = true;
                checkBtn.disabled = true;
                codeInput.disabled = true;
                messageEl.textContent = "";
                card.classList.add("exit");
                burstScene.classList.add("show", "opening");
                window.setTimeout(() => burstScene.classList.add("exploded"), 420);
                window.setTimeout(() => {
                    window.location.href = "two.html";
                }, 1450);
            } else {
                messageEl.textContent = "รหัสไม่ถูกต้อง ลองใหม่อีกครั้งใส่วันเกิดเดือนปี";
                messageEl.classList.add("error");
            }
        };

        checkBtn.addEventListener("click", unlock);
        codeInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                unlock();
            }
        });

    </script>
</body>
</html>
